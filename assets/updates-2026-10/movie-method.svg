<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">每日拆电影 · 从画面到判断</title><desc id="desc">一周围绕一部电影，从白描画面到解释机制、影片观察、解释边界与迁移问题的方法图。不是学习完成量。</desc><rect width="1200" height="780" fill="#f6f3e9"/><g fill="#24352d" font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="70" y="80" font-size="18" letter-spacing="4">LOKI / 每日拆电影</text><text x="70" y="155" font-size="48" font-weight="700">一部电影，慢慢看进去。</text><text x="70" y="200" font-size="22">先看见画面，再留下能带到下一部片的问题。</text></g><path d="M70 238H1130" stroke="#24352d" stroke-width="3"/><g font-family="PingFang SC, sans-serif"><rect x="70" y="275" width="330" height="160" fill="#deef82" stroke="#a2aa95"/><text x="94" y="313" font-size="22" fill="#526354">01</text><text x="94" y="363" font-size="29" font-weight="600" fill="#24352d">白描画面</text><text x="94" y="401" font-size="20" fill="#526354">它拍了什么？</text><rect x="435" y="275" width="330" height="160" fill="#fffdf5" stroke="#a2aa95"/><text x="459" y="313" font-size="22" fill="#526354">02</text><text x="459" y="363" font-size="29" font-weight="600" fill="#24352d">解释机制</text><text x="459" y="401" font-size="20" fill="#526354">为什么这样拍？</text><rect x="800" y="275" width="330" height="160" fill="#fffdf5" stroke="#a2aa95"/><text x="824" y="313" font-size="22" fill="#526354">03</text><text x="824" y="363" font-size="29" font-weight="600" fill="#24352d">影片观察</text><text x="824" y="401" font-size="20" fill="#526354">它让我们看见什么？</text><rect x="70" y="470" width="330" height="160" fill="#fffdf5" stroke="#a2aa95"/><text x="94" y="508" font-size="22" fill="#526354">04</text><text x="94" y="558" font-size="29" font-weight="600" fill="#24352d">解释边界</text><text x="94" y="596" font-size="20" fill="#526354">哪里还只是推断？</text><rect x="435" y="470" width="330" height="160" fill="#fffdf5" stroke="#a2aa95"/><text x="459" y="508" font-size="22" fill="#526354">05</text><text x="459" y="558" font-size="29" font-weight="600" fill="#24352d">迁移判断</text><text x="459" y="596" font-size="20" fill="#526354">下次怎样认出来？</text><rect x="800" y="470" width="330" height="160" fill="#e7c3cd" stroke="#a2aa95"/><text x="824" y="508" font-size="22" fill="#526354">06</text><text x="824" y="558" font-size="29" font-weight="600" fill="#24352d">当日回收</text><text x="824" y="596" font-size="20" fill="#526354">留下一个自己的问题。</text><text x="70" y="715" font-size="18" fill="#526354">方法结构示意 · AI 辅助导读，材料范围逐卡说明。</text></g></svg>
